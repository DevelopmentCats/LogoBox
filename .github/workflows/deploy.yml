name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'logobox/website/**'
      - 'logobox/assets/**'
      - 'logobox/package/**'
      - '.env.example'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: logobox/package-lock.json
      
      - name: Install dependencies
        run: |
          cd logobox
          npm ci
      
      - name: Run environment check
        run: |
          cd logobox
          npm run env-check
      
      - name: Run unit tests
        run: |
          cd logobox
          npm run test:unit
      
      - name: Run integration tests
        run: |
          cd logobox
          npm run test:integration
      
      - name: Run website tests
        run: |
          cd logobox/website
          npm run test:unit
      
      - name: Run package tests
        run: |
          cd logobox/package
          npm run test:unit

  build:
    name: Build Website
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-time: ${{ steps.build-info.outputs.time }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: logobox/package-lock.json
      
      - name: Install dependencies
        run: |
          cd logobox
          npm ci
      
      - name: Validate metadata
        run: |
          cd logobox
          npm run validate-metadata
      
      - name: Generate logo variants
        run: |
          cd logobox
          npm run generate-variants
      
      - name: Optimize assets
        run: |
          cd logobox
          npm run optimize-assets
      
      - name: Build catalog
        run: |
          cd logobox
          npm run build-catalog
      
      - name: Build website
        run: |
          cd logobox
          npm run build --workspace=website
        env:
          NODE_ENV: production
          VITE_BUILD_TIME: ${{ github.run_id }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPO: DevelopmentCats/LogoBox
      
      - name: Generate build info
        id: build-info
        run: |
          BUILD_HASH=$(find logobox/website/dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "hash=${BUILD_HASH}" >> $GITHUB_OUTPUT
          echo "time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Build hash: ${BUILD_HASH}"
          echo "Build time: ${BUILD_TIME}"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build-${{ github.run_id }}
          path: logobox/website/dist/
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://logobox.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-build-${{ github.run_id }}
          path: logobox/website/dist/
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: logobox
          directory: logobox/website/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
      
      - name: Wait for deployment propagation
        run: sleep 30
      
      - name: Run smoke tests
        run: |
          echo "🔍 Running production smoke tests..."
          
          # Test main page
          if curl -f -s https://logobox.com/ > /dev/null; then
            echo "✅ Main page accessible"
          else
            echo "❌ Main page not accessible"
            exit 1
          fi
          
          # Test 404 page
          if curl -f -s https://logobox.com/404.html > /dev/null; then
            echo "✅ 404 page accessible"
          else
            echo "❌ 404 page not accessible"
            exit 1
          fi
          
          # Test catalog endpoint
          if curl -f -s https://logobox.com/catalog.json > /dev/null; then
            echo "✅ Catalog accessible"
          else
            echo "❌ Catalog not accessible"
            exit 1
          fi
          
          # Test sample logo
          if curl -f -s https://logobox.com/logos/github/logo.svg > /dev/null; then
            echo "✅ Sample logo accessible"
          else
            echo "❌ Sample logo not accessible"
            exit 1
          fi
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "Website: https://logobox.com"
          echo "Build Hash: ${{ needs.build.outputs.build-hash }}"
          echo "Build Time: ${{ needs.build.outputs.build-time }}"
          echo "Commit: ${{ github.sha }}"

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'
    environment:
      name: preview
      url: https://preview.logobox.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-build-${{ github.run_id }}
          path: logobox/website/dist/
      
      - name: Deploy to Cloudflare Pages (Preview)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: logobox-preview
          directory: logobox/website/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
      
      - name: Wait for deployment propagation
        run: sleep 30
      
      - name: Run smoke tests
        run: |
          echo "🔍 Running preview smoke tests..."
          
          # Test main page
          if curl -f -s https://preview.logobox.com/ > /dev/null; then
            echo "✅ Preview main page accessible"
          else
            echo "❌ Preview main page not accessible"
            exit 1
          fi
          
          # Test catalog endpoint
          if curl -f -s https://preview.logobox.com/catalog.json > /dev/null; then
            echo "✅ Preview catalog accessible"
          else
            echo "❌ Preview catalog not accessible"
            exit 1
          fi
      
      - name: Notify preview deployment success
        if: success()
        run: |
          echo "🎉 Preview deployment successful!"
          echo "Preview URL: https://preview.logobox.com"
          echo "Build Hash: ${{ needs.build.outputs.build-hash }}"
          echo "Build Time: ${{ needs.build.outputs.build-time }}"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-production.result == 'failure' || needs.deploy-preview.result == 'failure')
    needs: [deploy-production, deploy-preview]
    
    steps:
      - name: Notify rollback needed
        run: |
          echo "❌ Deployment failed, manual rollback may be required"
          echo "Check Cloudflare Pages dashboard for deployment status"
          echo "Consider reverting to previous commit if necessary"
          
          if [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            echo "Production deployment failed"
          fi
          
          if [[ "${{ needs.deploy-preview.result }}" == "failure" ]]; then
            echo "Preview deployment failed"
          fi
      
      - name: Create rollback issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Deployment Failure - Rollback Required`;
            const body = `
            ## Deployment Failure Report
            
            **Workflow Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit:** ${context.sha}
            **Branch:** ${context.ref}
            **Triggered by:** ${context.actor}
            
            ### Failed Jobs:
            ${needs.deploy-production.result === 'failure' ? '- ❌ Production deployment' : ''}
            ${needs.deploy-preview.result === 'failure' ? '- ❌ Preview deployment' : ''}
            
            ### Next Steps:
            1. Check Cloudflare Pages dashboard for detailed error logs
            2. Review build artifacts and deployment configuration
            3. Consider reverting to previous working commit
            4. Fix underlying issues and redeploy
            
            ### Environment Information:
            - Node.js Version: ${process.env.NODE_VERSION}
            - Build Hash: ${{ needs.build.outputs.build-hash }}
            - Build Time: ${{ needs.build.outputs.build-time }}
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment', 'urgent']
            });

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, build, deploy-production, deploy-preview]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "status=❌ Tests Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=❌ Build Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            echo "status=❌ Production Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-preview.result }}" == "failure" ]]; then
            echo "status=❌ Preview Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Deployment Completed Successfully" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi
      
      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Production Deploy: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Preview Deploy: ${{ needs.deploy-preview.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Build Hash: ${{ needs.build.outputs.build-hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Time: ${{ needs.build.outputs.build-time }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Details:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY