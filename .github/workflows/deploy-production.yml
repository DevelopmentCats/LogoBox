name: Prod Deployment

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/**'
      - 'package/**'
      - '.env.example'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests (Production)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run environment check
        run: npm run env-check
        env:
          # Website configuration (production)
          VITE_APP_TITLE: "LogoBox"
          VITE_APP_DESCRIPTION: "Browse and discover high-quality logos and icons"
          VITE_API_BASE_URL: "https://api.logobox.dev"
          VITE_CDN_BASE_URL: "https://cdn.logobox.dev"
          VITE_CATALOG_PATH: "/catalog.json"
          VITE_LOGOS_PATH: "/logos"
          VITE_API_TIMEOUT: "15000"
          VITE_API_RETRY_ATTEMPTS: "3"
          VITE_API_RETRY_DELAY: "2000"
          VITE_ENABLE_ANALYTICS: "true"
          VITE_ENABLE_PERFORMANCE_MONITORING: "false"
          VITE_LOG_LEVEL: "warn"
          VITE_CDN_FALLBACK_URL_1: "https://backup-cdn1.logobox.dev"
          VITE_CDN_FALLBACK_URL_2: "https://backup-cdn2.logobox.dev"
          # Package configuration (production)
          LOGOBOX_BASE_URL: "https://logobox.dev"
          LOGOBOX_CDN_BASE_URL: "https://cdn.logobox.dev"
          LOGOBOX_DEFAULT_VARIANT: "original"
          LOGOBOX_CACHE_ENABLED: "true"
          LOGOBOX_CACHE_TTL: "3600000"
          LOGOBOX_API_BASE_URL: "https://api.logobox.dev"
          # GitHub secrets for deployment check
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Run performance tests
        run: npm run test:performance
        
      - name: Run website tests
        run: |
          cd website
          npm run test:unit
          npm run test:integration
      
      - name: Run package tests
        run: |
          cd package
          npm run test:unit

  build:
    name: Build Website (Production)
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-time: ${{ steps.build-info.outputs.time }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate metadata
        run: npm run validate-metadata
      
      - name: Generate logo variants
        run: npm run generate-variants
      
      - name: Optimize assets
        run: npm run optimize-assets
      
      - name: Build catalog
        run: npm run build-catalog
      
      - name: Install Wrangler CLI
        run: npm install -g wrangler
      
      - name: Deploy assets to CDN
        run: |
          chmod +x ./deployment/scripts/deploy-cdn.sh
          ./deployment/scripts/deploy-cdn.sh production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_CDN_TESTS: "true"
      
      - name: Build website
        run: npm run build --workspace=website
        env:
          NODE_ENV: production
          VITE_BUILD_TIME: ${{ github.run_id }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPO: DevelopmentCats/LogoBox
          VITE_ENVIRONMENT: production
          # Website configuration (production)
          VITE_APP_TITLE: LogoBox
          VITE_APP_DESCRIPTION: Browse and discover high-quality logos and icons
          VITE_API_BASE_URL: https://api.logobox.dev
          VITE_CDN_BASE_URL: https://cdn.logobox.dev
          VITE_CATALOG_PATH: /catalog.json
          VITE_LOGOS_PATH: /logos
          VITE_API_TIMEOUT: 15000
          VITE_API_RETRY_ATTEMPTS: 3
          VITE_API_RETRY_DELAY: 2000
          VITE_ENABLE_ANALYTICS: true
          VITE_ENABLE_PERFORMANCE_MONITORING: false
          VITE_LOG_LEVEL: warn
          VITE_CDN_FALLBACK_URL_1: https://backup-cdn1.logobox.dev
          VITE_CDN_FALLBACK_URL_2: https://backup-cdn2.logobox.dev
          # Package configuration (production)
          LOGOBOX_BASE_URL: https://logobox.dev
          LOGOBOX_CDN_BASE_URL: https://cdn.logobox.dev
          LOGOBOX_DEFAULT_VARIANT: original
          LOGOBOX_CACHE_ENABLED: true
          LOGOBOX_CACHE_TTL: 3600000
          LOGOBOX_API_BASE_URL: https://api.logobox.dev
      
      - name: Generate build info
        id: build-info
        run: |
          BUILD_HASH=$(find website/dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "hash=${BUILD_HASH}" >> $GITHUB_OUTPUT
          echo "time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Build hash: ${BUILD_HASH}"
          echo "Build time: ${BUILD_TIME}"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build-prod-${{ github.run_id }}
          path: website/dist/
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    # environment:
    #   name: production
    #   url: https://logobox.dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-build-prod-${{ github.run_id }}
          path: website/dist/
      
      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: logobox
          directory: website/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
      
      - name: Wait for deployment propagation
        run: sleep 60
      
      - name: Run smoke tests
        run: |
          echo "🔍 Running production smoke tests..."
          
          # Test main page
          if curl -f -s https://logobox.dev/ > /dev/null; then
            echo "✅ Production main page accessible"
          else
            echo "❌ Production main page not accessible"
            exit 1
          fi
          
          # Test 404 page
          if curl -f -s https://logobox.dev/404.html > /dev/null; then
            echo "✅ Production 404 page accessible"
          else
            echo "❌ Production 404 page not accessible"
            exit 1
          fi
          
          # Test catalog endpoint
          if curl -f -s https://logobox.dev/catalog.json > /dev/null; then
            echo "✅ Production catalog accessible"
          else
            echo "❌ Production catalog not accessible"
            exit 1
          fi
          
          # Test sample logo
          if curl -f -s https://logobox.dev/logos/github/logo.svg > /dev/null; then
            echo "✅ Production sample logo accessible"
          else
            echo "❌ Production sample logo not accessible"
            exit 1
          fi
          
          # Test CDN catalog
          if curl -f -s https://cdn.logobox.dev/catalog.json > /dev/null; then
            echo "✅ CDN catalog accessible"
          else
            echo "❌ CDN catalog not accessible"
            exit 1
          fi
          
          # Test CDN sample logo
          if curl -f -s https://cdn.logobox.dev/logos/github/logo.svg > /dev/null; then
            echo "✅ CDN sample logo accessible"
          else
            echo "❌ CDN sample logo not accessible"
            exit 1
          fi
      
      - name: Publish NPM Package
        if: success()
        run: |
          echo "📦 Publishing NPM package..."
          cd package
          npm run publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "Production Website: https://logobox.dev"
          echo "CDN: https://cdn.logobox.dev"
          echo "Build Hash: ${{ needs.build.outputs.build-hash }}"
          echo "Build Time: ${{ needs.build.outputs.build-time }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: main"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: [deploy-production]
    
    steps:
      - name: Notify rollback needed
        run: |
          echo "❌ Production deployment failed, manual rollback may be required"
          echo "Check Cloudflare Pages dashboard for deployment status"
          echo "Consider reverting to previous commit if necessary"
      
      - name: Create rollback issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Production Deployment Failure - Rollback Required`;
            const body = `
            ## Production Deployment Failure Report
            
            **Workflow Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit:** ${context.sha}
            **Branch:** main
            **Triggered by:** ${context.actor}
            
            ### Failed Jobs:
            - ❌ Production deployment
            
            ### Next Steps:
            1. Check Cloudflare Pages dashboard for detailed error logs
            2. Review build artifacts and deployment configuration
            3. Consider reverting to previous working commit on main branch
            4. Fix underlying issues and redeploy
            
            ### Environment Information:
            - Node.js Version: ${process.env.NODE_VERSION}
            - Build Hash: ${{ needs.build.outputs.build-hash }}
            - Build Time: ${{ needs.build.outputs.build-time }}
            - Target URL: https://logobox.dev
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment', 'production', 'urgent']
            });

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, build, deploy-production]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "status=❌ Production Tests Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=❌ Production Build Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            echo "status=❌ Production Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Production Deployment Completed Successfully" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi
      
      - name: Create deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Production Deploy: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Build Hash: ${{ needs.build.outputs.build-hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Time: ${{ needs.build.outputs.build-time }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** https://logobox.dev" >> $GITHUB_STEP_SUMMARY
          echo "**CDN URL:** https://cdn.logobox.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Details:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY