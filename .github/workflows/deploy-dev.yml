name: Dev Deployment

on:
  push:
    branches: [development]
    paths:
      - 'website/**'
      - 'assets/**'
      - 'package/**'
      - '.env.example'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests (Development)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run environment check
        run: npm run env-check
        env:
          # Website configuration (development)
          VITE_APP_TITLE: "LogoBox (Dev)"
          VITE_APP_DESCRIPTION: "Browse and discover high-quality logos and icons - Development Environment"
          VITE_API_BASE_URL: "https://dev-api.logobox.dev"
          VITE_CDN_BASE_URL: "https://dev-cdn.logobox.dev"
          VITE_CATALOG_PATH: "/catalog.json"
          VITE_LOGOS_PATH: "/logos"
          VITE_API_TIMEOUT: "5000"
          VITE_API_RETRY_ATTEMPTS: "2"
          VITE_API_RETRY_DELAY: "500"
          VITE_ENABLE_ANALYTICS: "false"
          VITE_ENABLE_PERFORMANCE_MONITORING: "true"
          VITE_LOG_LEVEL: "debug"
          VITE_CDN_FALLBACK_URL_1: "https://dev-backup-cdn1.logobox.dev"
          VITE_CDN_FALLBACK_URL_2: "https://dev-backup-cdn2.logobox.dev"
          # Package configuration (development)
          LOGOBOX_BASE_URL: "https://dev.logobox.dev"
          LOGOBOX_CDN_BASE_URL: "https://dev-cdn.logobox.dev"
          LOGOBOX_DEFAULT_VARIANT: "original"
          LOGOBOX_CACHE_ENABLED: "true"
          LOGOBOX_CACHE_TTL: "1800000"
          LOGOBOX_API_BASE_URL: "https://dev-api.logobox.dev"
          # GitHub secrets for deployment check
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Run website tests
        run: |
          cd website
          npm run test:unit
      
      - name: Run package tests
        run: |
          cd package
          npm run test:unit

  build:
    name: Build Website (Development)
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-time: ${{ steps.build-info.outputs.time }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate metadata
        run: npm run validate-metadata
      
      - name: Generate logo variants
        run: npm run generate-variants
      
      - name: Optimize assets
        run: npm run optimize-assets
      
      - name: Build catalog
        run: npm run build-catalog
      
      - name: Install Wrangler CLI
        run: npm install -g wrangler
      
      - name: Deploy assets to CDN
        run: |
          chmod +x ./deployment/scripts/deploy-cdn.sh
          ./deployment/scripts/deploy-cdn.sh dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Build website
        run: npm run build --workspace=website
        env:
          NODE_ENV: development
          VITE_BUILD_TIME: ${{ github.run_id }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPO: DevelopmentCats/LogoBox
          VITE_ENVIRONMENT: development
          # Website configuration (development)
          VITE_APP_TITLE: LogoBox (Dev)
          VITE_APP_DESCRIPTION: Browse and discover high-quality logos and icons - Development Environment
          VITE_API_BASE_URL: https://dev-api.logobox.dev
          VITE_CDN_BASE_URL: https://dev-cdn.logobox.dev
          VITE_CATALOG_PATH: /catalog.json
          VITE_LOGOS_PATH: /logos
          VITE_API_TIMEOUT: 5000
          VITE_API_RETRY_ATTEMPTS: 2
          VITE_API_RETRY_DELAY: 500
          VITE_ENABLE_ANALYTICS: false
          VITE_ENABLE_PERFORMANCE_MONITORING: true
          VITE_LOG_LEVEL: debug
          VITE_CDN_FALLBACK_URL_1: https://dev-backup-cdn.logobox.dev
          VITE_CDN_FALLBACK_URL_2: https://dev-backup2-cdn.logobox.dev
          # Package configuration (development)
          LOGOBOX_BASE_URL: https://dev.logobox.dev
          LOGOBOX_CDN_BASE_URL: https://dev-cdn.logobox.dev
          LOGOBOX_DEFAULT_VARIANT: original
          LOGOBOX_CACHE_ENABLED: true
          LOGOBOX_CACHE_TTL: 1800000
          LOGOBOX_API_BASE_URL: https://dev-api.logobox.dev
      
      - name: Generate build info
        id: build-info
        run: |
          BUILD_HASH=$(find website/dist -type f -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "hash=${BUILD_HASH}" >> $GITHUB_OUTPUT
          echo "time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Build hash: ${BUILD_HASH}"
          echo "Build time: ${BUILD_TIME}"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build-dev-${{ github.run_id }}
          path: website/dist/
          retention-days: 7

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: development
      url: https://dev.logobox.dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-build-dev-${{ github.run_id }}
          path: website/dist/
      
      - name: Deploy to Cloudflare Pages (Development)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: logobox-dev
          directory: website/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
      
      - name: Wait for deployment propagation
        run: sleep 30
      
      - name: Run smoke tests
        run: |
          echo "🔍 Running development smoke tests..."
          
          # Test main page
          if curl -f -s https://dev.logobox.dev/ > /dev/null; then
            echo "✅ Development main page accessible"
          else
            echo "❌ Development main page not accessible"
            exit 1
          fi
          
          # Test 404 page
          if curl -f -s https://dev.logobox.dev/404.html > /dev/null; then
            echo "✅ Development 404 page accessible"
          else
            echo "❌ Development 404 page not accessible"
            exit 1
          fi
          
          # Test catalog endpoint
          if curl -f -s https://dev.logobox.dev/catalog.json > /dev/null; then
            echo "✅ Development catalog accessible"
          else
            echo "❌ Development catalog not accessible"
            exit 1
          fi
          
          # Test sample logo
          if curl -f -s https://dev.logobox.dev/logos/github/logo.svg > /dev/null; then
            echo "✅ Development sample logo accessible"
          else
            echo "❌ Development sample logo not accessible"
            exit 1
          fi
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Development deployment successful!"
          echo "Development Website: https://dev.logobox.dev"
          echo "Build Hash: ${{ needs.build.outputs.build-hash }}"
          echo "Build Time: ${{ needs.build.outputs.build-time }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: development"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-development.result == 'failure'
    needs: [deploy-development]
    
    steps:
      - name: Notify rollback needed
        run: |
          echo "❌ Development deployment failed, manual rollback may be required"
          echo "Check Cloudflare Pages dashboard for deployment status"
          echo "Consider reverting to previous commit if necessary"
      
      - name: Create rollback issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Development Deployment Failure - Rollback Required`;
            const body = `
            ## Development Deployment Failure Report
            
            **Workflow Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit:** ${context.sha}
            **Branch:** development
            **Triggered by:** ${context.actor}
            
            ### Failed Jobs:
            - ❌ Development deployment
            
            ### Next Steps:
            1. Check Cloudflare Pages dashboard for detailed error logs
            2. Review build artifacts and deployment configuration
            3. Consider reverting to previous working commit on development branch
            4. Fix underlying issues and redeploy
            
            ### Environment Information:
            - Node.js Version: ${process.env.NODE_VERSION}
            - Build Hash: ${{ needs.build.outputs.build-hash }}
            - Build Time: ${{ needs.build.outputs.build-time }}
            - Target URL: https://dev.logobox.dev
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment', 'development']
            });

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, build, deploy-development]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "status=❌ Development Tests Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=❌ Development Build Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-development.result }}" == "failure" ]]; then
            echo "status=❌ Development Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Development Deployment Completed Successfully" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi
      
      - name: Create deployment summary
        run: |
          echo "## Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Development Deploy: ${{ needs.deploy-development.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Build Hash: ${{ needs.build.outputs.build-hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Time: ${{ needs.build.outputs.build-time }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: development" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Development URL:** https://dev.logobox.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Details:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY